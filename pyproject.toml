[project]
name = "frenchtutor"
version = "0.1.0"
description = "Interactive Gradio web application for learning French tailored for Spanish speakers"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "gradio",
    "transformers",
    "sentence-transformers",
    "fasttext",
    "huggingface_hub",
    "numpy<2",
    "sentencepiece",
    "sacremoses",
    "language-tool-python",
    "spacy>=3.8.15",
    "edge-tts>=7.2.8",
]

[project.optional-dependencies]
cpu = [
    "torch",
]
cu124 = [
    "torch",
]

[tool.uv]
package = true
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu124" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
markers = [
    "ml: tests requiring Hugging Face / PyTorch ML models",
    "slow: tests that take significant time to run",
]
addopts = "-v -m 'not ml'"

[tool.setuptools.packages.find]
include = ["backend*"]
