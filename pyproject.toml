[project]
name = "frenchtutor"
version = "0.1.0"
description = "Interactive Gradio web application for learning French tailored for Spanish speakers"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "gradio",
    "transformers",
    "sentence-transformers",
    "fasttext",
    "huggingface_hub",
    "numpy<2",
    "sentencepiece",
    "sacremoses",
    "language-tool-python",
    "pymupdf>=1.23.0",
    "datasketch>=1.5.0",
    "spacy>=3.8.15",
    "fr-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl",
    "edge-tts>=7.2.8",
]

[project.optional-dependencies]
cpu = [
    "torch<2.5.0",
]
cu118 = [
    "torch<2.5.0",
]
cu124 = [
    "torch<2.5.0",
]

[tool.uv]
package = true
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu118" },
        { extra = "cu124" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
markers = [
    "ml: tests requiring Hugging Face / PyTorch ML models",
    "slow: tests that take significant time to run",
]
addopts = "-v -m 'not ml' --tb=short"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/models.py"]

[tool.coverage.report]
show_missing = true

[tool.setuptools.packages.find]
include = ["backend*"]
